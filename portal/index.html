<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15132b">
  <title>Avrana Party</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px; display: flex; align-items: center; justify-content: center; background: #15132b; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 36px 26px; border: 1px solid #46405f; border-radius: 24px; background: #211d3a; text-align: center; }
    .brand { margin: 0 0 32px; color: #c7b8ff; font-size: 20px; font-weight: 750; letter-spacing: .04em; }
    h1 { margin: 0 0 16px; font-size: clamp(30px, 8vw, 40px); line-height: 1.1; }
    p { color: #d5d0e5; line-height: 1.6; }
    .play { display: block; margin: 28px 0 20px; padding: 17px 24px; border-radius: 14px; background: #c7b8ff; color: #17112e; font-weight: 750; font-size: 18px; text-decoration: none; }
    .play:active { background: #e1d8ff; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .note { margin-bottom: 0; font-size: 14px; }
    .help { margin-top: 28px; padding-top: 20px; border-top: 1px solid #46405f; font-size: 14px; }
    .help a { color: #e1d8ff; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Avrana Party</p>
    <h1>Ready to play?</h1>
    <p>Gather your people.<br>Pick a game. Let the fun begin.</p>
    <a class="play" href="http://party.local/">Let’s play</a>
    <p class="note">Stay connected to Avrana Party Wi-Fi.<br>No app. No account. No internet needed.</p>
    <p class="help">Trouble playing here? Stay on this Wi-Fi and open <a href="http://party.local/">http://party.local</a> in Safari.</p>
  </main>
</body>
</html>
