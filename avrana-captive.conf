# Apple captive portal detection
address=/captive.apple.com/10.42.0.1
# Keep AAAA/HTTPS queries local too; do not leak Apple's public CNAME.
local=/captive.apple.com/
# iPhones can retain and resolve this canonical alias independently.
address=/captive.g.aaplimg.com/10.42.0.1
local=/captive.g.aaplimg.com/

# Android / Google
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/clients3.google.com/10.42.0.1

# Windows
address=/www.msftconnecttest.com/10.42.0.1
address=/msftconnecttest.com/10.42.0.1

# Firefox
address=/detectportal.firefox.com/10.42.0.1

# Browser-trusted Full Mode origin. Resolve only on the Party network;
# public DNS does not point this hostname at a private address.
host-record=party.avrana.net,10.42.0.1

# The game origin (ADR 0013, AVR-319): a sibling of the Party host, served by the same nginx on
# the same address. Same rule as above: it resolves only on the Party network. Harmless before the
# nginx block and the certificate name exist, but nothing sends a phone there until Party Core's
# game_origins says so (docs/runbooks/game-origin.md).
host-record=games.avrana.net,10.42.0.1
