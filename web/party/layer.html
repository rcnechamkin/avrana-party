<!doctype html>
<html lang="en" data-theme="avrana" class="avrana-layer-doc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>Your Party</title>
<!-- The Party layer over a game (AVR-292): the floating Party button and its drawer, drawn by the
     Party in a frame a game page mounts (bridge/layer-mount.js). The server sends this page
     `frame-ancestors` naming the Party's own origin and the game origins; every other Party page
     keeps `frame-ancestors 'none'`. -->
<link rel="stylesheet" href="styles.css">
<script type="module" src="lib/layer-app.js"></script>
</head>
<body class="avrana-layer">
<button id="layer-button" type="button" class="avrana-layer-button" aria-haspopup="dialog" aria-label="Your Party" hidden>
  <span class="ring" aria-hidden="true"><span data-icon="users"></span></span><span id="layer-unread" class="unread" aria-hidden="true"></span>
</button>
<button id="layer-tab" type="button" class="avrana-layer-tab" aria-label="Show the Party button" hidden><span data-icon="chevron-left"></span></button>

<div id="layer-open" class="avrana-layer-open" hidden>
  <div id="layer-backdrop" class="avrana-layer-backdrop"></div>
  <section id="layer-sheet" class="avrana-drawer avrana-layer-sheet" role="dialog" aria-modal="true" aria-labelledby="layer-h">
    <div class="head"><h2 id="layer-h" class="m-0">Your Party</h2><button id="layer-close" type="button" class="btn btn-ghost btn-square" aria-label="Close"><span data-icon="x"></span></button></div>
    <p id="layer-where" class="where"></p>
    <p id="layer-link" class="where text-warning empty:hidden" role="status"></p>
    <div id="layer-tabs" class="avrana-tabs" role="group" aria-label="Show">
      <button id="layer-tab-people" type="button" data-tab="people" aria-pressed="true">People</button>
      <button id="layer-tab-chat" type="button" data-tab="chat" aria-pressed="false">Chat<span id="layer-tab-unread" class="unread" aria-hidden="true"></span></button>
    </div>
    <div id="layer-people" class="body">
      <ul id="layer-people-list" class="avrana-people" aria-label="People at the party"></ul>
      <div id="layer-host" class="avrana-layer-host" hidden>
        <h3 class="m-0 text-supporting font-medium text-muted">Host</h3>
        <div id="layer-actions" class="avrana-layer-actions"></div>
        <div id="layer-confirm" class="avrana-layer-confirm" hidden>
          <p id="layer-confirm-text" class="m-0" tabindex="-1"></p>
          <label id="layer-pick-label" for="layer-pick" class="text-supporting text-muted" hidden>Hand over to</label>
          <select id="layer-pick" class="select w-full" hidden></select>
          <div class="flex gap-2"><button id="layer-yes" type="button" class="btn btn-primary"></button><button id="layer-no" type="button" class="btn btn-ghost">Cancel</button></div>
          <p id="layer-confirm-error" class="m-0 text-body text-warning empty:hidden" role="status"></p>
        </div>
      </div>
      <!-- PROPOSAL home_in_round (AVR-703, Concept K K2): Party Home during a round, only when the appliance's
           party-core.json switches the proposal on. This frame cannot navigate the page (its sandbox has no
           top navigation): it asks Party Core, and the bridge's existing `navigate` takes this phone home. -->
      <div id="layer-home" class="avrana-layer-host" hidden>
        <button id="layer-home-go" type="button" class="btn btn-outline w-full justify-start">Party Home</button>
        <p class="avrana-proposal is-inline">Proposal · Home during a round</p>
        <p id="layer-home-error" class="m-0 text-body text-warning empty:hidden" role="status"></p>
      </div>
      <!-- Leave Party (AVR-580): the same Core endpoint and words as Party Home's sheet; membership only. -->
      <div id="layer-leave" class="avrana-layer-host" hidden>
        <button id="layer-leave-ask" type="button" class="btn btn-outline w-full justify-start">Leave Party</button>
        <div id="layer-leave-confirm" class="avrana-layer-confirm" hidden>
          <p id="layer-leave-text" class="m-0" tabindex="-1"></p>
          <p id="layer-leave-host" class="m-0 empty:hidden"></p>
          <div class="flex gap-2"><button id="layer-leave-yes" type="button" class="btn btn-primary">Leave Party</button><button id="layer-leave-no" type="button" class="btn btn-ghost">Stay</button></div>
          <p id="layer-leave-error" class="m-0 text-body text-warning empty:hidden" role="status"></p>
        </div>
      </div>
      <!-- A guest over a game page of another origin (AVR-580 guest exit): this only asks. The page could
           cover this frame, so the confirmation is on Party Home, which no game page can draw over. -->
      <div id="layer-exit" class="avrana-layer-host" hidden>
        <button id="layer-exit-ask" type="button" class="btn btn-outline w-full justify-start" aria-describedby="layer-exit-note">Leave Party…</button>
        <p id="layer-exit-note" class="m-0 text-supporting text-muted" aria-live="polite">You will confirm on Party Home. Nothing changes until you do.</p>
        <p id="layer-exit-error" class="m-0 text-body text-warning empty:hidden" role="status"></p>
      </div>
      <div class="avrana-layer-moves" role="group" aria-labelledby="layer-moves-h">
        <h3 id="layer-moves-h" class="m-0 w-full text-supporting font-medium text-muted">Party button position</h3>
        <button id="layer-nudge-up" type="button" class="btn btn-ghost btn-sm" data-nudge="up">Move up</button>
        <button id="layer-nudge-down" type="button" class="btn btn-ghost btn-sm" data-nudge="down">Move down</button>
        <button id="layer-nudge-left" type="button" class="btn btn-ghost btn-sm" data-nudge="left">Move left</button>
        <button id="layer-nudge-right" type="button" class="btn btn-ghost btn-sm" data-nudge="right">Move right</button>
        <button id="layer-park-left" type="button" class="btn btn-ghost btn-sm">Park on the left edge</button>
        <button id="layer-park-right" type="button" class="btn btn-ghost btn-sm">Park on the right edge</button>
        <button id="layer-reset" type="button" class="btn btn-ghost btn-sm">Reset position</button>
      </div>
      <!-- Controller shortcut (AVR-581): shown once a controller is connected or a shortcut is kept. A
           connected controller never hides the Party button by itself; hiding is offered only after the
           shortcut has opened this menu once, and a disconnect brings the button back at once. -->
      <div id="layer-pad" class="avrana-layer-moves" role="group" aria-labelledby="layer-pad-h" hidden>
        <h3 id="layer-pad-h" class="m-0 w-full text-supporting font-medium text-muted">Controller shortcut</h3>
        <p id="layer-pad-status" class="m-0 w-full text-body" aria-live="polite"></p>
        <button id="layer-pad-learn" type="button" class="btn btn-ghost btn-sm">Set up a shortcut</button>
        <button id="layer-pad-forget" type="button" class="btn btn-ghost btn-sm" hidden>Forget the shortcut</button>
        <label id="layer-pad-hide-row" class="flex w-full items-center gap-2 text-body" hidden>
          <input id="layer-pad-hide" type="checkbox" class="checkbox checkbox-sm">
          Hide the Party button while this controller is connected
        </label>
      </div>
    </div>
    <div id="chat" class="body" hidden>
      <p id="chat-status" class="m-0 text-body text-muted empty:hidden" role="status"></p>
      <ol id="chat-messages" aria-label="Party messages"></ol>
      <p id="chat-feedback" class="text-body text-warning empty:hidden" role="status"></p>
      <p id="chat-live" class="sr-only" aria-live="polite"></p>
    </div>
    <form id="chat-form" class="compose" hidden>
      <label for="chat-text" class="sr-only">Message</label>
      <input id="chat-text" class="input min-w-0 flex-1 text-base" maxlength="400" autocomplete="off" placeholder="Message the Party" required><button id="chat-send" type="submit" class="btn btn-primary" disabled><span data-icon="send-horizontal"></span>Send</button>
    </form>
  </section>
</div>
</body>
</html>
