# Headless mode (default while HDMI is disconnected): private Xvfb + private
# PulseAudio null sink. Input is the X keyboard of that private display only,
# so the live arcade instance (its own display, udev pads) never sees it.
# Keys are distinct per player (banks 1-4 MUST match BANKS in stream_ps1.py) so
# stream_ps1.py / tools/xkeys.py can drive each RetroArch user independently.
video_fullscreen = "false"
video_windowed_fullscreen = "false"
video_window_width = "640"
video_window_height = "480"
video_scale = "2.0"
audio_driver = "pulse"
input_driver = "x"
input_joypad_driver = "null"
# RetroArch 1.20 ignores "null" here and falls back to udev, which enumerates the
# arcade's uinput pads (read-only, no grab). Pin every PS1 user to a joypad index
# that never exists so no pad can ever drive a PS1 player in this mode.
input_player1_joypad_index = "15"
input_player2_joypad_index = "15"
input_player3_joypad_index = "15"
input_player4_joypad_index = "15"
input_player5_joypad_index = "15"
# Hotkeys only fire while scroll_lock is held, so game keys never trigger them.
input_enable_hotkey = "scroll_lock"
input_menu_toggle = "nul"
input_exit_emulator = "nul"
input_toggle_fullscreen = "nul"
input_save_state = "nul"
