<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15132b">
<title>Avrana Party · PS1</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html{overscroll-behavior:none}
body{margin:0;background:#15132b;color:#eee;font-family:system-ui,sans-serif;padding:12px;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:18px;margin:8px 0}p{font-size:14px;color:#cbc5e0}a{color:#c7b8ff}
video{display:block;width:100%;max-height:56vh;aspect-ratio:4/3;background:#000;object-fit:contain;margin:10px auto}
.stage,.controls,.controls *{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative}.stage.cropped{overflow:hidden;margin:10px auto;background:#000}.stage.cropped video{position:absolute;max-height:none;aspect-ratio:auto;margin:0;object-fit:fill}.start-overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#15132bcc}.start-overlay[hidden]{display:none}.start-overlay button{font-size:20px;padding:16px 28px}
button{font:inherit;font-weight:700;background:#c7b8ff;color:#15132b;border:0;border-radius:12px;min-height:44px;padding:8px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button:active,button.held{background:#fff}button:disabled{opacity:.45}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:12px;max-width:760px;margin:auto;align-items:center}.controls[hidden]{display:none}
.shoulders{grid-column:1/-1;display:flex;justify-content:space-between}.shoulders div{display:flex;gap:6px}.shoulders button{min-width:56px}
.dpad,.face{display:grid;grid-template-columns:repeat(3,52px);gap:4px}.dpad button,.face button{height:52px}.face button{border-radius:26px;font-size:22px}
.mid{display:flex;justify-content:center;gap:8px}#status{min-height:22px}#metrics{font-family:monospace;font-size:12px}
@media(orientation:landscape) and (max-height:600px){video{max-height:70vh}.controls{position:fixed;bottom:8px;left:8px;right:8px;max-width:none;pointer-events:none}.controls button{pointer-events:auto;opacity:.85}header h1{font-size:15px}}
</style>
<header><h1 id="title">Avrana Party · PS1</h1><span id="role"></span></header>
<p id="party-bar" hidden><a href="/party/">← Party Home</a></p>
<p id="status" role="status">Tap Play to take a controller, or Watch to spectate.</p>
<button id="sound" disabled>Enable sound</button> <button id="leave" disabled>Disconnect</button> <button id="fullview" aria-pressed="false" hidden>Full view</button>
<div class="stage">
<video id="screen" autoplay playsinline muted></video>
<div class="start-overlay" id="start-overlay"><button id="connect">▶ Play</button><button id="watch">👀 Watch</button></div>
</div>
<div class="controls" id="controls" hidden>
 <div class="shoulders"><div><button data-bit="10">L2</button><button data-bit="8">L1</button></div><div><button data-bit="9">R1</button><button data-bit="11">R2</button></div></div>
 <div class="dpad" aria-label="Movement">
  <span></span><button data-bit="0" aria-label="Up">▲</button><span></span>
  <button data-bit="2" aria-label="Left">◀</button><span></span><button data-bit="3" aria-label="Right">▶</button>
  <span></span><button data-bit="1" aria-label="Down">▼</button><span></span>
 </div>
 <div class="mid"><button data-bit="13">Select</button><button data-bit="12">Start</button></div>
 <div class="face" aria-label="Buttons">
  <span></span><button data-bit="7" aria-label="Triangle">△</button><span></span>
  <button data-bit="6" aria-label="Square">□</button><span></span><button data-bit="5" aria-label="Circle">○</button>
  <span></span><button data-bit="4" aria-label="Cross">✕</button><span></span>
 </div>
</div>
<details><summary>Connection details</summary><p id="metrics">Not connected</p></details>
<script>
'use strict';
// Video is the same shared stream for everyone; input is this phone's own slot.
// The server assigns the slot and a token (kept in localStorage) that reclaims it
// after a reconnect. The client only ever sends a 14-bit button mask.
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const $=s=>document.querySelector(s);
const status=$('#status'),video=$('video'),connect=$('#connect'),watchBtn=$('#watch'),sound=$('#sound'),leave=$('#leave'),overlay=$('#start-overlay'),pad=$('#controls');
video.addEventListener('playing',()=>{overlay.hidden=true});
let ws=null,pc=null,ready=false,heartbeat=null,statsTimer=null,pendingIce=[],signalChain=Promise.resolve(),mySlot=0,game='ps1';
const held=new Map(),buttons=[...document.querySelectorAll('[data-bit]')];
const TOKEN_KEY='avrana-ps1-token';
const store={get(){try{return localStorage.getItem(TOKEN_KEY)}catch(_){return null}},set(v){try{v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY)}catch(_){}}};
let lastMask=-1,seq=0;const sentAt=new Map(),ackRtts=[];
function mask(){let m=0;for(const b of held.values())m|=1<<b;return m}
function sendInput(){if(ws?.readyState!==WebSocket.OPEN||!ready||!mySlot)return;if(ws.bufferedAmount>8192){disconnect('Connection is too slow. Tap Play to reconnect.');return}
 const m=mask(),msg={type:'state',b:m,seq:++seq};if(m!==lastMask){lastMask=m;sentAt.set(seq,performance.now());if(sentAt.size>200)sentAt.delete(sentAt.keys().next().value)}
 ws.send(JSON.stringify(msg))}
function releaseAll(){held.clear();buttons.forEach(b=>b.classList.remove('held'));sendInput()}
// Personal Viewports (experiment): the server may give this seat a rectangle of the ONE shared
// frame; show just that part (CSS crop, no extra encode). Full view shows the whole frame.
let viewport=null,fullView=false;const stage=$('.stage'),fullBtn=$('#fullview');
function applyView(){const r=viewport&&!fullView?viewport.rect:null;fullBtn.hidden=!viewport;fullBtn.setAttribute('aria-pressed',String(fullView));
 stage.classList.toggle('cropped',!!r);
 if(!r){stage.style.width=stage.style.aspectRatio='';Object.assign(video.style,{width:'',height:'',left:'',top:''});return}
 const [x,y,w,h]=r;stage.style.aspectRatio=String(viewport.aspect);stage.style.width=`min(100%, calc(56vh * ${viewport.aspect}))`;
 Object.assign(video.style,{width:`${100/w}%`,height:`${100/h}%`,left:`${-x/w*100}%`,top:`${-y/h*100}%`})}
fullBtn.onclick=()=>{fullView=!fullView;applyView()};
function disconnect(message='Disconnected. Tap Play to reconnect.'){
 releaseAll();ready=false;mySlot=0;clearInterval(heartbeat);clearInterval(statsTimer);pad.hidden=true;$('#role').textContent='';
 if(ws){ws.onclose=null;ws.close();ws=null}if(pc){pc.close();pc=null}video.srcObject=null;
 connect.disabled=watchBtn.disabled=false;overlay.hidden=false;leave.disabled=true;sound.disabled=true;status.textContent=message;viewport=null;applyView();
}
buttons.forEach(button=>{
 const bit=+button.dataset.bit;
 button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);held.set(e.pointerId,bit);button.classList.add('held');sendInput()});
 const up=e=>{held.delete(e.pointerId);if(![...held.values()].includes(bit))button.classList.remove('held');sendInput()};
 button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',up);
 button.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
window.addEventListener('blur',releaseAll);window.addEventListener('pagehide',()=>disconnect());
// Leave frees the controller at once (the server skips its 30 s reconnect grace); closing or
// reloading the page (pagehide) keeps the token so a reload can reclaim the same slot.
leave.onclick=()=>{if(ws?.readyState===WebSocket.OPEN&&mySlot)ws.send(JSON.stringify({type:'leave'}));store.set(null);disconnect('Controller released.')};
sound.onclick=async()=>{video.muted=!video.muted;try{await video.play();sound.textContent=video.muted?'Enable sound':'Mute sound'}catch(e){status.textContent='Tap Enable sound again to start playback.'}};
let vf=null,prev=null,pingId=0;const pingAt=new Map(),pingRtts=[];
const pct=(a,q)=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);return +b[Math.min(b.length-1,Math.floor(q*b.length))].toFixed(1)};
async function collect(){
 if(!pc||!ws||ws.readyState!==WebSocket.OPEN)return;
 const id=++pingId;pingAt.set(id,performance.now());ws.send(JSON.stringify({type:'ping',id}));
 const stats=await pc.getStats(),cur={};
 for(const s of stats.values()){if(s.type==='inbound-rtp')cur[s.kind]=s;else if(s.type==='candidate-pair'&&(s.nominated||s.state==='succeeded'))cur.pair=s}
 const v=cur.video,a=cur.audio,pv=prev?.video,pa=prev?.audio,d=(x,y,k)=>x&&y?(x[k]||0)-(y[k]||0):null;
 const out={vis:document.visibilityState,ackRtt:{n:ackRtts.length,p50:pct(ackRtts,.5),p95:pct(ackRtts,.95),max:pct(ackRtts,1)},pingRtt:{p50:pct(pingRtts,.5),max:pct(pingRtts,1)}};
 ackRtts.length=0;pingRtts.length=0;
 if(v){const df=d(v,pv,'framesDecoded'),jb=d(v,pv,'jitterBufferDelay'),je=d(v,pv,'jitterBufferEmittedCount');
  out.video={w:v.frameWidth,h:v.frameHeight,fps:v.framesPerSecond,decoded:df,received:d(v,pv,'framesReceived'),dropped:d(v,pv,'framesDropped'),
   jitterBufMs:je?+(jb/je*1000).toFixed(1):null,pktLostD:d(v,pv,'packetsLost'),freezes:v.freezeCount,kbps:d(v,pv,'bytesReceived')!=null?Math.round(d(v,pv,'bytesReceived')*8/1000):null}}
 if(a){const je=d(a,pa,'jitterBufferEmittedCount');out.audio={jitterBufMs:je?+(d(a,pa,'jitterBufferDelay')/je*1000).toFixed(1):null,pktLostD:d(a,pa,'packetsLost')}}
 if(cur.pair)out.pair={rtt:cur.pair.currentRoundTripTime};
 if(vf){const g=vf.gaps;out.present={n:vf.n,gapP50:pct(g,.5),gapP95:pct(g,.95),gapMax:pct(g,1),over50:g.filter(x=>x>50).length};vf.n=0;vf.gaps=[]}
 prev=cur;$('#metrics').textContent=JSON.stringify(out);
 if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'stats',s:out}));
}
function start(watching){
 if(!window.RTCPeerConnection){status.textContent='Open this page in your phone’s regular browser.';return}
 prev=null;lastMask=-1;connect.disabled=watchBtn.disabled=true;status.textContent='Connecting…';pendingIce=[];signalChain=Promise.resolve();
 pc=new RTCPeerConnection({iceServers:[]});
 const media=new MediaStream();video.srcObject=media;
 pc.ontrack=e=>{media.addTrack(e.track);try{e.receiver.jitterBufferTarget=0}catch(_){}try{e.receiver.playoutDelayHint=0}catch(_){}video.play().catch(()=>{status.textContent='Tap Enable sound to start playback.'})};
 pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ice',candidate:e.candidate.candidate,sdpMLineIndex:e.candidate.sdpMLineIndex}))};
 pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='connected'){ready=true;leave.disabled=false;sound.disabled=false;pad.hidden=!mySlot;
   status.textContent=mySlot?`You are Player ${mySlot} in ${game}.`:partyGame?`Watching ${game}: you have no seat in this game.`:`Watching ${game}. Every controller is taken (or you chose Watch).`;sendInput()}
  else if(['failed','closed'].includes(pc.connectionState))disconnect('Connection lost. Tap Play to reconnect.')};
 // The token goes in the first message (hello), never in the URL: URLs end up in access logs.
 ws=new WebSocket(new URL('ws',location.href).href.replace(/^http/,'ws'));
 // In a party the controller comes from this phone's seat ticket (fetched fresh from its own
 // Party Home view); without a seat it watches. Standalone it is the reclaim token.
 ws.onopen=async()=>{let hello={type:'hello',role:watching?'watch':'play',token:watching?null:store.get()};
  if(partyGame&&!watching){let ticket=null;try{ticket=(await (await fetch('/party/state',{credentials:'same-origin'})).json()).me?.seat_ticket||null}catch(_){}
   hello={type:'hello',role:'play',ticket}}
  if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(hello))};
 ws.onmessage=e=>{signalChain=signalChain.then(async()=>{
  const message=JSON.parse(e.data);
  if(message.type==='ack'){const t=sentAt.get(message.seq);if(t!==undefined){ackRtts.push(performance.now()-t);sentAt.delete(message.seq)}return}
  if(message.type==='pong'){const t=pingAt.get(message.id);if(t!==undefined){pingRtts.push(performance.now()-t);pingAt.delete(message.id)}return}
  if(message.type==='player'){mySlot=message.slot;game=message.game;if(message.token)store.set(message.token);viewport=message.viewport||null;applyView();
   $('#title').textContent=`Avrana Party · ${game}`;$('#role').textContent=mySlot?`Player ${mySlot}`:'Spectator';return}
  if(!pc)return;
  if(message.type==='offer'){await pc.setRemoteDescription({type:'offer',sdp:message.sdp});for(const c of pendingIce)await pc.addIceCandidate(c);pendingIce=[];await pc.setLocalDescription(await pc.createAnswer());ws.send(JSON.stringify({type:'answer',sdp:pc.localDescription.sdp}))}
  else if(message.type==='ice'){const c={candidate:message.candidate,sdpMLineIndex:message.sdpMLineIndex};if(pc.remoteDescription)await pc.addIceCandidate(c);else pendingIce.push(c)}
 }).catch(e=>{console.error(e);disconnect('Could not start video. Try your regular browser.')})};
 ws.onclose=e=>disconnect(e.code===4001?'This controller was opened on another tab or device.':`Disconnected (${e.code}). Tap Play to reconnect.`);
 ws.onerror=()=>disconnect('Could not connect. Stay on Avrana Party Wi-Fi and try again.');
 heartbeat=setInterval(()=>{if(!document.hidden)sendInput()},50);
 statsTimer=setInterval(collect,1000);
 if(video.requestVideoFrameCallback){vf={n:0,last:0,gaps:[]};const tick=now=>{if(vf.last)vf.gaps.push(now-vf.last);vf.last=now;vf.n++;if(pc)video.requestVideoFrameCallback(tick)};video.requestVideoFrameCallback(tick)}
}
connect.onclick=()=>start(false);watchBtn.onclick=()=>start(true);
// Inside a party (served at /ps1/<title>/ by the party's front door): keep this phone's party
// presence attached while it plays, and go back to Party Home when the host ends or switches
// the game. Standalone (:8198/) there is no party and this does nothing.
const partyGame=(location.pathname.match(/^\/ps1\/([a-z0-9_-]+)\/$/)||[])[1];
if(partyGame&&window.EventSource){
 $('#party-bar').hidden=false;
 const es=new EventSource('/party/events');
 es.addEventListener('state',e=>{const nav=JSON.parse(e.data).party.nav;
  if(nav.target!=='ps1-'+partyGame){es.close();disconnect('The game ended. Back to Party Home…');location.assign('/party/')}});
}
</script>
</html>
