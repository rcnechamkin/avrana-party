<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- Zoom stays off on this controller page on purpose: pinches during play would zoom the pad. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0c1d">
<title>Avrana Party</title>
<style>
:root{
  --bg:#0e0c1d; --surface:#1b1833; --text:#f4f2ff; --muted:#b9b3d6; --accent:#c7b8ff;
  --key:rgba(255,255,255,.11); --key-edge:rgba(255,255,255,.18); --key-on:rgba(199,184,255,.55);
  --k:clamp(44px,calc((100vw - 64px) / 6.4),64px);   /* one controller key: two 3-key clusters + margins fit the width */
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- layout: portrait = bar / picture / controller ------------------------------------ */
.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr;padding:var(--safe-t) var(--safe-r) 0 var(--safe-l)}
.bar{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px}
.bar .title{flex:1;min-width:0;font-weight:650;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.icon{min-width:44px;height:44px;border-radius:22px;display:inline-grid;place-items:center;font-size:20px;color:var(--text);text-decoration:none}
.icon:active{background:var(--key)}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent);color:#15132b;white-space:nowrap}
.chip[hidden]{display:none}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;touch-action:none}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage.cropped video{object-fit:fill;inset:auto}
.pad{display:grid;align-content:center;padding:10px 14px calc(12px + var(--safe-b));gap:14px;touch-action:none;
  grid-template-columns:auto 1fr auto;grid-template-areas:"shl . shr" "dpad . face" "mid mid mid"}
.pad[hidden]{display:none}
.shl{grid-area:shl;justify-self:start;display:flex;gap:8px}.shr{grid-area:shr;justify-self:end;display:flex;gap:8px}
.dpad{grid-area:dpad;justify-self:start}.face{grid-area:face;justify-self:end}
.mid{grid-area:mid;justify-self:center;display:flex;gap:12px}
.dpad,.face{display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(3,var(--k));gap:2px}
.k{touch-action:none;display:grid;place-items:center;background:var(--key);border:1px solid var(--key-edge);color:var(--text);font-weight:700;transition:background .06s}
.k.held{background:var(--key-on)}
.dpad .k{border-radius:12px;font-size:22px}
.face .k{border-radius:50%;font-size:24px}
.sh{height:44px;min-width:64px;border-radius:14px;font-size:.9rem}
.pill{height:44px;min-width:72px;border-radius:22px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.face .tri{color:#8fe3c9}.face .cir{color:#ff9c9c}.face .crs{color:#9cc2ff}.face .sqr{color:#f3a6e3}

/* ---- landscape: picture as tall as it can be WITHOUT reaching the side gutters, where the
   controls live; icons sit at the top of the gutters. Nothing is drawn over the picture. -------- */
@media (orientation:landscape) and (max-height:620px){
  :root{--k:clamp(40px,11vh,54px);--gutter:calc(3 * var(--k) + 20px)}
  .app{grid-template-rows:1fr;grid-template-columns:1fr auto 1fr;padding:0 var(--safe-r) 0 var(--safe-l)}
  .bar{display:contents}
  .bar .title{display:none}
  #party-bar,#more,#sound,#role{position:fixed;z-index:3}
  #party-bar{top:4px;left:calc(6px + var(--safe-l))}
  #more{top:4px;left:calc(52px + var(--safe-l))}
  #sound{top:4px;right:calc(6px + var(--safe-r))}
  #role{top:14px;right:calc(56px + var(--safe-r))}
  .stage{grid-column:2;grid-row:1;align-self:center;width:auto;aspect-ratio:4/3;
    height:min(100dvh,calc((100vw - 2 * var(--gutter) - var(--safe-l) - var(--safe-r)) * .75))}
  .app:not(.playing) .stage{height:min(100dvh,calc((100vw - 104px - var(--safe-l) - var(--safe-r)) * .75))}
  .pad,.mid{display:contents}
  .shl,.shr,.dpad,.face,.sel,.start{position:fixed;margin:0}
  .sh{min-width:56px}.shl,.shr{gap:6px}
  .shl{top:56px;left:calc(12px + var(--safe-l))}
  .shr{top:56px;right:calc(12px + var(--safe-r))}
  .dpad{top:50%;transform:translateY(-32%);left:calc(10px + var(--safe-l))}
  .face{top:50%;transform:translateY(-32%);right:calc(10px + var(--safe-r))}
  .sel{bottom:calc(8px + var(--safe-b));left:calc(12px + var(--safe-l))}
  .start{bottom:calc(8px + var(--safe-b));right:calc(12px + var(--safe-r))}
}
/* portrait spectators: no controller, so centre the picture */
@media not ((orientation:landscape) and (max-height:620px)){
  .app:not(.playing){grid-template-rows:auto 1fr}
  .app:not(.playing) .stage{align-self:center}
}

/* ---- overlays ----------------------------------------------------------------------------- */
.card{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;padding:20px;text-align:center;
  background:radial-gradient(ellipse at center,rgba(14,12,29,.72),rgba(14,12,29,.92))}
.card[hidden]{display:none}
.card h1{margin:0;font-size:1.35rem}
.card p{margin:0;color:var(--muted);max-width:28ch}
.primary{min-width:180px;min-height:52px;border-radius:26px;background:var(--accent);color:#15132b;font-weight:750;font-size:1.1rem;padding:0 28px}
.primary:disabled{opacity:.5}
.secondary{min-height:44px;padding:0 18px;border-radius:22px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(14,12,29,.85);border:1px solid var(--key-edge);
  padding:6px 14px;border-radius:999px;font-size:.85rem;white-space:nowrap;z-index:2}
.toast[hidden]{display:none}
button.toast{min-height:44px;color:var(--text)}
.sheet{border:0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--text);padding:8px 8px calc(12px + var(--safe-b));
  width:min(100%,480px);margin:auto auto 0;max-height:80dvh}
.sheet::backdrop{background:rgba(0,0,0,.55)}
.sheet h2{font-size:.85rem;color:var(--muted);font-weight:600;margin:10px 14px 4px;text-transform:uppercase;letter-spacing:.06em}
.sheet button,.sheet a{display:flex;width:100%;min-height:52px;align-items:center;padding:0 16px;border-radius:12px;color:var(--text);text-decoration:none;font-size:1rem}
.sheet button:active,.sheet a:active{background:var(--key)}
.sheet [hidden]{display:none}
.diag{position:absolute;left:4px;bottom:4px;right:4px;font:11px/1.3 ui-monospace,monospace;background:rgba(0,0,0,.6);color:#d7ffd7;
  padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre-wrap;z-index:2}
.diag[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main class="app" id="app">
  <header class="bar">
    <a class="icon" id="party-bar" href="/party/" aria-label="Back to Party Home" hidden>‹</a>
    <span class="title" id="title">Avrana Party</span>
    <span class="chip" id="role" hidden></span>
    <button class="icon" id="sound" aria-pressed="false" aria-label="Sound off" hidden>🔇</button>
    <button class="icon" id="more" aria-label="Menu" aria-haspopup="dialog">⋯</button>
  </header>

  <section class="stage" aria-label="Game screen">
    <video id="screen" autoplay playsinline muted></video>
    <p class="toast" id="toast" role="status" hidden></p>
    <div class="card" id="start-overlay">
      <h1 id="card-title">Ready to play?</h1>
      <p id="status" role="status">You get your own controller. Others see the same screen.</p>
      <button class="primary" id="connect">Play</button>
      <button class="secondary" id="watch">Just watch</button>
    </div>
    <pre class="diag" id="diag" hidden></pre>
  </section>

  <section class="pad" id="controls" aria-label="Controller" hidden>
    <div class="shl"><button class="k sh" data-bit="10">L2</button><button class="k sh" data-bit="8">L1</button></div>
    <div class="shr"><button class="k sh" data-bit="9">R1</button><button class="k sh" data-bit="11">R2</button></div>
    <div class="dpad" role="group" aria-label="Direction pad">
      <span></span><button class="k" data-bit="0" aria-label="Up">▲</button><span></span>
      <button class="k" data-bit="2" aria-label="Left">◀</button><span></span><button class="k" data-bit="3" aria-label="Right">▶</button>
      <span></span><button class="k" data-bit="1" aria-label="Down">▼</button><span></span>
    </div>
    <div class="face" role="group" aria-label="Action buttons">
      <span></span><button class="k tri" data-bit="7" aria-label="Triangle">△</button><span></span>
      <button class="k sqr" data-bit="6" aria-label="Square">□</button><span></span><button class="k cir" data-bit="5" aria-label="Circle">○</button>
      <span></span><button class="k crs" data-bit="4" aria-label="Cross">✕</button><span></span>
    </div>
    <div class="mid"><button class="k pill sel" data-bit="13">Select</button><button class="k pill start" data-bit="12">Start</button></div>
  </section>
</main>

<dialog class="sheet" id="menu" aria-label="Menu">
  <h2>Game</h2>
  <button id="sound-menu">Turn sound on</button>
  <button id="fullview" aria-pressed="false" hidden>Show the whole screen</button>
  <button id="leave">Give up my controller</button>
  <a id="menu-party" href="/party/" hidden>Back to Party Home</a>
  <button id="close-menu">Back to the game</button>
</dialog>
<p id="metrics" hidden>Not connected</p>

<script>
'use strict';
// One shared video stream for everyone; this phone's input drives only its own controller.
// Standalone the server assigns a controller and a reclaim token (localStorage); inside a party the
// controller comes from this phone's seat ticket. The phone only ever sends a 14-bit button mask.
// Latency: every stage we can time is timed (docs/findings/*-ps1-latency.md); #diag shows them.
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const $=s=>document.querySelector(s);
const app=$('#app'),status=$('#status'),video=$('video'),connect=$('#connect'),watchBtn=$('#watch'),overlay=$('#start-overlay'),
  pad=$('#controls'),toastEl=$('#toast'),soundBtn=$('#sound'),menu=$('#menu'),diagEl=$('#diag'),stage=$('.stage'),fullBtn=$('#fullview');
const DIAG=/(^|[#&])diag\b/.test(location.hash);
const partyGame=(location.pathname.match(/^\/ps1\/([a-z0-9_-]+)\/$/)||[])[1];
if(partyGame){$('#party-bar').hidden=false;$('#menu-party').hidden=false}
diagEl.hidden=!DIAG;

let ws=null,pc=null,ready=false,heartbeat=null,statsTimer=null,pingTimer=null,pendingIce=[],signalChain=Promise.resolve(),mySlot=0,game='ps1',title='';
let wantWatch=false,retries=0,retryTimer=null,ended=false,measure=false;
const held=new Map(),buttons=[...document.querySelectorAll('[data-bit]')];
const TOKEN_KEY='avrana-ps1-token';
const store={get(){try{return localStorage.getItem(TOKEN_KEY)}catch(_){return null}},set(v){try{v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY)}catch(_){}}};

// ---- small UI helpers -------------------------------------------------------------------------
let toastTimer=null;
function toast(text,ms=0){toastEl.textContent=text;toastEl.hidden=!text;clearTimeout(toastTimer);if(text&&ms)toastTimer=setTimeout(()=>{toastEl.hidden=true},ms)}
function showCard(heading,text,{play='Play',watch=true}={}){overlay.hidden=false;$('#card-title').textContent=heading;status.textContent=text;
  connect.textContent=play;connect.disabled=false;watchBtn.hidden=!watch;watchBtn.disabled=false}
function setSound(on){video.muted=!on;soundBtn.textContent=on?'🔊':'🔇';soundBtn.setAttribute('aria-pressed',String(on));
  soundBtn.setAttribute('aria-label',on?'Sound on':'Sound off');$('#sound-menu').textContent=on?'Turn sound off':'Turn sound on'}
async function toggleSound(){const on=video.muted;setSound(on);if(on){try{await video.play()}catch(_){setSound(false);toast('Tap the speaker again for sound',3000)}}}
soundBtn.onclick=toggleSound;$('#sound-menu').onclick=()=>{toggleSound();menu.close()};
$('#more').onclick=()=>{if(menu.showModal)menu.showModal();else menu.setAttribute('open','')};
$('#close-menu').onclick=()=>menu.close();
function vibrate(){try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}

// ---- input ------------------------------------------------------------------------------------
let lastMask=-1,seq=0,touchAt=null;const sentAt=new Map(),ackRtts=[],pend=new Map();
function mask(){let m=0;for(const b of held.values())m|=1<<b;return m}
function sendInput(){if(ws?.readyState!==WebSocket.OPEN||!ready||!mySlot)return;
 if(ws.bufferedAmount>8192){toast('Connection is struggling…',1500);return}
 const m=mask(),msg={type:'state',b:m,seq:++seq};
 if(m!==lastMask){lastMask=m;const now=performance.now();sentAt.set(seq,now);
  if(touchAt!==null){pend.set(seq,{touch:touchAt,send:now});touchAt=null}
  if(sentAt.size>200)sentAt.delete(sentAt.keys().next().value);if(pend.size>50)pend.delete(pend.keys().next().value)}
 ws.send(JSON.stringify(msg))}
function releaseAll(){held.clear();buttons.forEach(b=>b.classList.remove('held'));sendInput()}
buttons.forEach(button=>{
 const bit=+button.dataset.bit;
 button.addEventListener('pointerdown',e=>{e.preventDefault();touchAt=e.timeStamp;button.setPointerCapture(e.pointerId);held.set(e.pointerId,bit);button.classList.add('held');vibrate();sendInput()});
 const up=e=>{held.delete(e.pointerId);if(![...held.values()].includes(bit))button.classList.remove('held');sendInput()};
 button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',up);
 button.addEventListener('contextmenu',e=>e.preventDefault());
});

// ---- Personal Viewports (experiment): crop this seat's rectangle of the ONE shared frame ---------
let viewport=null,fullView=false;
function applyView(){const r=viewport&&!fullView?viewport.rect:null;fullBtn.hidden=!viewport;fullBtn.setAttribute('aria-pressed',String(fullView));
 fullBtn.textContent=fullView?'Show only my part of the screen':'Show the whole screen';
 stage.classList.toggle('cropped',!!r);
 if(!r){stage.style.aspectRatio='';Object.assign(video.style,{width:'',height:'',left:'',top:''});return}
 const [x,y,w,h]=r;stage.style.aspectRatio=String(viewport.aspect);
 Object.assign(video.style,{width:`${100/w}%`,height:`${100/h}%`,left:`${-x/w*100}%`,top:`${-y/h*100}%`})}
fullBtn.onclick=()=>{fullView=!fullView;applyView();menu.close()};

// ---- latency measurement --------------------------------------------------------------------------
// Stages: A touch->send (phone, exact) · B send->server receives (one-way, clock-offset estimate)
// C server receives->key injected (server, exact) · E frame captured->shown (clock-offset estimate;
// measure mode) · D touch->first frame captured after the injection is shown (measure mode; excludes
// the game's own reaction time) · RTT round trips. Offset = the ping with the lowest round trip.
const wall=()=>performance.timeOrigin+performance.now();
const clock={samples:[],off:null,rtt:null};
const lat={A:[],B:[],C:[],D:[],E:[],rtt:[]};let waitFrame=null,pingId=0;const pingAt=new Map();
let stampCanvas=null,stampCtx=null;
function onPong(msg){const t0=pingAt.get(msg.id);if(t0===undefined)return;pingAt.delete(msg.id);const t1=performance.now(),rtt=t1-t0;lat.rtt.push(rtt);
 if(typeof msg.st==='number'){clock.samples.push({rtt,off:msg.st-(performance.timeOrigin+(t0+t1)/2)});if(clock.samples.length>40)clock.samples.shift();
  const best=clock.samples.reduce((a,b)=>b.rtt<a.rtt?b:a);clock.off=best.off;clock.rtt=best.rtt}}
function onAck(msg){const t=sentAt.get(msg.seq);if(t!==undefined){ackRtts.push(performance.now()-t);sentAt.delete(msg.seq)}
 const p=pend.get(msg.seq);if(!p)return;pend.delete(msg.seq);lat.A.push(p.send-p.touch);
 if(typeof msg.rx==='number'&&clock.off!==null)lat.B.push(msg.rx-clock.off-(performance.timeOrigin+p.send));
 if(typeof msg.inj==='number'){lat.C.push(msg.inj-msg.rx);if(measure&&typeof msg.id==='number')waitFrame={id:msg.id,touch:p.touch}}}
function readStamp(){ // 32 blocks of 8x8 px in the top-left of the source frame; bit = block brighter than mid-grey
 if(!stampCanvas){stampCanvas=document.createElement('canvas');stampCanvas.width=256;stampCanvas.height=8;stampCtx=stampCanvas.getContext('2d',{willReadFrequently:true})}
 stampCtx.drawImage(video,0,0,256,8,0,0,256,8);const px=stampCtx.getImageData(0,0,256,8).data;let v=0;
 for(let i=0;i<32;i++){v=v*2+(px[(4*256+i*8+4)*4]>128?1:0)}return v}
function onFrame(presentPerf){if(!measure||clock.off===null||!video.videoWidth)return;
 let v;try{v=readStamp()}catch(_){return}
 const serverNow=wall()+clock.off,stampMs=Math.floor(v/256),id=v%256;
 const capture=serverNow-(((Math.floor(serverNow)%16777216)-stampMs+16777216)%16777216);
 const e=performance.timeOrigin+presentPerf+clock.off-capture;if(e>-50&&e<5000)lat.E.push(e);
 if(waitFrame&&((id-waitFrame.id+256)%256)<128){const d=presentPerf-waitFrame.touch;if(d>0&&d<5000)lat.D.push(d);waitFrame=null}}
const pct=(a,q)=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);return +b[Math.min(b.length-1,Math.floor(q*b.length))].toFixed(1)};
const summ=a=>a.length?{n:a.length,p50:pct(a,.5),p95:pct(a,.95),max:pct(a,1)}:null;

// ---- stats (every second: to the server log, and to #diag) ----------------------------------------
let vf=null,prev=null;
async function collect(){
 if(!pc||!ws||ws.readyState!==WebSocket.OPEN)return;
 const stats=await pc.getStats(),cur={};
 for(const s of stats.values()){if(s.type==='inbound-rtp')cur[s.kind]=s;else if(s.type==='candidate-pair'&&(s.nominated||s.state==='succeeded'))cur.pair=s}
 const v=cur.video,a=cur.audio,pv=prev?.video,pa=prev?.audio,d=(x,y,k)=>x&&y?(x[k]||0)-(y[k]||0):null;
 const out={vis:document.visibilityState,ackRtt:{n:ackRtts.length,p50:pct(ackRtts,.5),p95:pct(ackRtts,.95),max:pct(ackRtts,1)},
  pingRtt:{p50:pct(lat.rtt,.5),max:pct(lat.rtt,1)},lat:{},clock:{off:clock.off===null?null:+clock.off.toFixed(1),rtt:clock.rtt===null?null:+clock.rtt.toFixed(1)}};
 const sum={};for(const k of ['A','B','C','D','E','rtt']){sum[k]=summ(lat[k]);out.lat[k]=lat[k].map(x=>Math.round(x*10)/10);lat[k].length=0}  // raw: the report computes percentiles
 ackRtts.length=0;
 if(v){const df=d(v,pv,'framesDecoded'),jb=d(v,pv,'jitterBufferDelay'),je=d(v,pv,'jitterBufferEmittedCount');
  out.video={w:v.frameWidth,h:v.frameHeight,fps:v.framesPerSecond,decoded:df,received:d(v,pv,'framesReceived'),dropped:d(v,pv,'framesDropped'),
   jitterBufMs:je?+(jb/je*1000).toFixed(1):null,pktLostD:d(v,pv,'packetsLost'),freezes:v.freezeCount,kbps:d(v,pv,'bytesReceived')!=null?Math.round(d(v,pv,'bytesReceived')*8/1000):null}}
 if(a){const je=d(a,pa,'jitterBufferEmittedCount');out.audio={jitterBufMs:je?+(d(a,pa,'jitterBufferDelay')/je*1000).toFixed(1):null,pktLostD:d(a,pa,'packetsLost')}}
 if(cur.pair)out.pair={rtt:cur.pair.currentRoundTripTime};
 if(vf){const g=vf.gaps;out.present={n:vf.n,gapP50:pct(g,.5),gapP95:pct(g,.95),gapMax:pct(g,1),over50:g.filter(x=>x>50).length};vf.n=0;vf.gaps=[]}
 prev=cur;$('#metrics').textContent=JSON.stringify(out);
 if(DIAG){const f=s=>s?`${s.p50}/${s.p95}/${s.max}`:'-';
  diagEl.textContent=`rtt ${f(sum.rtt)}  ack ${out.ackRtt.p50??'-'}/${out.ackRtt.max??'-'}  gapmax ${out.present?.gapMax??'-'}  lost ${out.video?.pktLostD??'-'}  jb ${out.video?.jitterBufMs??'-'}\n`+
   `A ${f(sum.A)}  B ${f(sum.B)}  C ${f(sum.C)}  E ${f(sum.E)}  D ${f(sum.D)}  off±${out.clock.rtt??'-'}${measure?'':'  (measure off)'}`}
 if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'stats',s:out}));
}

// ---- connection lifecycle -------------------------------------------------------------------------
function teardown(){releaseAll();ready=false;mySlot=0;clearInterval(heartbeat);clearInterval(statsTimer);clearInterval(pingTimer);
 if(ws){ws.onclose=null;ws.onerror=null;ws.close();ws=null}if(pc){pc.onconnectionstatechange=null;pc.close();pc=null}
 video.srcObject=null;pad.hidden=true;$('#role').hidden=true;app.classList.remove('playing','watching');viewport=null;applyView()}
function stopped(heading,text,opts){teardown();clearTimeout(retryTimer);showCard(heading,text,opts)}
function lost(){ // unexpected drop: try again quietly a few times (sleep/wake, a Wi-Fi hiccup)
 if(ended)return;teardown();
 if(retries<5){const wait=[500,1000,2000,4000,6000][retries++];toast('Reconnecting…');overlay.hidden=true;
  retryTimer=setTimeout(()=>start(wantWatch),wait);return}
 toast('');showCard('Can’t reach the game','Check you’re on the Avrana Party Wi-Fi, then try again.',{play:'Try again',watch:false})}
function start(watching){
 if(!window.RTCPeerConnection){showCard('Open in your browser','This page needs your phone’s regular browser (Safari or Chrome).',{watch:false});return}
 teardown();wantWatch=watching;
 // The tap is the user gesture iOS needs for sound: unmute now, fall back to muted if refused.
 setSound(true);video.play().catch(()=>{});
 prev=null;lastMask=-1;connect.disabled=watchBtn.disabled=true;if(!overlay.hidden)status.textContent='Connecting…';pendingIce=[];signalChain=Promise.resolve();
 pc=new RTCPeerConnection({iceServers:[]});
 const media=new MediaStream();video.srcObject=media;
 pc.ontrack=e=>{media.addTrack(e.track);try{e.receiver.jitterBufferTarget=0}catch(_){}try{e.receiver.playoutDelayHint=0}catch(_){}
  video.play().catch(()=>{setSound(false);video.play().catch(()=>{});toast('Tap 🔇 for sound',4000)})};
 pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ice',candidate:e.candidate.candidate,sdpMLineIndex:e.candidate.sdpMLineIndex}))};
 pc.onconnectionstatechange=()=>{if(!pc)return;
  if(pc.connectionState==='connected'){ready=true;retries=0;toast('');overlay.hidden=true;soundBtn.hidden=false;pad.hidden=!mySlot;
   app.classList.toggle('playing',!!mySlot);app.classList.toggle('watching',!mySlot);
   if(!mySlot)toast(partyGame?'Watching — you’re not playing this round':'Watching — every controller is taken',4000);sendInput()}
  else if(['failed','closed'].includes(pc.connectionState))lost()};
 // The token/ticket goes in the first message (hello), never in the URL: URLs end up in access logs.
 ws=new WebSocket(new URL('ws',location.href).href.replace(/^http/,'ws'));
 ws.onopen=async()=>{let hello={type:'hello',role:watching?'watch':'play',token:watching?null:store.get()};
  if(partyGame&&!watching){let ticket=null;try{ticket=(await (await fetch('/party/state',{credentials:'same-origin'})).json()).me?.seat_ticket||null}catch(_){}
   hello={type:'hello',role:'play',ticket}}
  if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(hello))};
 ws.onmessage=e=>{
  const message=JSON.parse(e.data);
  if(message.type==='ack'){onAck(message);return}      // handled at once: never queued behind signalling
  if(message.type==='pong'){onPong(message);return}
  signalChain=signalChain.then(async()=>{
  if(message.type==='player'){mySlot=message.slot;game=message.game;title=message.title||game;measure=!!message.measure;if(message.token)store.set(message.token);
   viewport=message.viewport||null;applyView();document.title=`${title} · Avrana Party`;$('#title').textContent=title;
   const role=$('#role');role.textContent=mySlot?`Player ${mySlot}`:'Spectator';role.hidden=false;return}
  if(!pc)return;
  if(message.type==='offer'){await pc.setRemoteDescription({type:'offer',sdp:message.sdp});for(const c of pendingIce)await pc.addIceCandidate(c);pendingIce=[];await pc.setLocalDescription(await pc.createAnswer());ws.send(JSON.stringify({type:'answer',sdp:pc.localDescription.sdp}))}
  else if(message.type==='ice'){const c={candidate:message.candidate,sdpMLineIndex:message.sdpMLineIndex};if(pc.remoteDescription)await pc.addIceCandidate(c);else pendingIce.push(c)}
 }).catch(err=>{console.error(err);lost()})};
 ws.onclose=e=>{if(e.code===4001)stopped('Playing somewhere else','This controller was opened in another tab or on another phone.',{play:'Play here'});
  else if(e.code===1000&&!ready)stopped('Ready to play?','',{});else lost()};
 ws.onerror=()=>{};  // onclose follows and decides
 heartbeat=setInterval(()=>{if(!document.hidden)sendInput()},50);
 statsTimer=setInterval(collect,1000);
 pingTimer=setInterval(()=>{if(ws?.readyState===WebSocket.OPEN){const id=++pingId;pingAt.set(id,performance.now());if(pingAt.size>40)pingAt.delete(pingAt.keys().next().value);ws.send(JSON.stringify({type:'ping',id}))}},250);
 if(video.requestVideoFrameCallback){vf={n:0,last:0,gaps:[]};const tick=(now,meta)=>{if(vf.last)vf.gaps.push(now-vf.last);vf.last=now;vf.n++;
   onFrame(meta&&meta.expectedDisplayTime?meta.expectedDisplayTime:now);if(pc)video.requestVideoFrameCallback(tick)};video.requestVideoFrameCallback(tick)}
}
connect.onclick=()=>{retries=0;start(false)};watchBtn.onclick=()=>{retries=0;start(true)};
// Leave frees the controller at once (the server skips its 30 s reconnect grace); closing or
// reloading the page (pagehide) keeps the token so a reload can reclaim the same slot.
$('#leave').onclick=()=>{if(ws?.readyState===WebSocket.OPEN&&mySlot)ws.send(JSON.stringify({type:'leave'}));store.set(null);menu.close();
 stopped('Controller given up','Someone else can play now.',{play:'Play again'})};
// Back from the lock screen or another app mid-game: reconnect quietly (same controller).
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();else if(!ws&&overlay.hidden&&!ended){retries=0;start(wantWatch)}});
window.addEventListener('blur',releaseAll);window.addEventListener('pagehide',()=>teardown());
// Inside a party (served at /ps1/<title>/ by the party's front door): keep this phone's party
// presence attached while it plays, and go back to Party Home when the host ends or switches
// the game. Standalone (:8198/) there is no party and this does nothing.
if(partyGame&&window.EventSource){
 const es=new EventSource('/party/events');
 es.addEventListener('state',e=>{const nav=JSON.parse(e.data).party.nav;
  if(nav.target!=='ps1-'+partyGame){ended=true;es.close();stopped('Game over','Heading back to the party…',{watch:false});location.assign('/party/')}});
}
</script>
</html>
