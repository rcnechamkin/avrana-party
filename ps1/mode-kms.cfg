# TV mode (UNTESTED: no HDMI display attached during bring-up). Fullscreen on the
# HDMI connector via KMS/DRM, ALSA audio, physical USB/Bluetooth pads via udev.
# Warning: the live arcade RetroArch also hot-plugs udev pads into its free
# slots 3-4; stop avranaparty-arcade before plugging pads in for PS1 play.
video_fullscreen = "true"
video_context_driver = "kms"
audio_driver = "alsa"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "3"
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"
input_player3_joypad_index = "2"
input_player4_joypad_index = "3"
input_player5_joypad_index = "4"
