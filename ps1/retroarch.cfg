# Avrana Party PS1 base config (RetroArch + PCSX-ReARMed). Template: run-ps1.sh
# replaces @PS1_HOME@ and writes the result to $PS1_HOME/runtime/retroarch.cfg.
# Isolated from arcade/retroarch.cfg; nothing here touches the arcade instance.
config_save_on_exit = "false"
game_specific_options = "false"
auto_overrides_enable = "false"
auto_remaps_enable = "false"
global_core_options = "true"
libretro_directory = "@PS1_HOME@/cores"
system_directory = "@PS1_HOME@/system"
savefile_directory = "@PS1_HOME@/saves"
savestate_directory = "@PS1_HOME@/states"
screenshot_directory = "@PS1_HOME@/screenshots"
rgui_config_directory = "@PS1_HOME@/runtime/config"
input_remapping_directory = "@PS1_HOME@/runtime/remaps"
joypad_autoconfig_dir = "@PS1_HOME@/runtime/autoconfig"
playlist_directory = "@PS1_HOME@/runtime/playlists"
content_history_dir = "@PS1_HOME@/runtime/history"
cache_directory = "@PS1_HOME@/runtime/cache"
log_dir = "@PS1_HOME@/runtime/logs"
core_options_path = "@PS1_HOME@/runtime/core-options.opt"
history_list_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
autosave_interval = "10"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
# Baseline: native rendering, no shaders/filters/rewind/runahead.
video_driver = "gl"
video_shader_enable = "false"
video_smooth = "false"
video_threaded = "false"
video_vsync = "true"
video_frame_delay = "0"
video_force_aspect = "true"
aspect_ratio_index = "0"
video_scale_integer = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
vrr_runloop_enable = "false"
fastforward_ratio = "1.0"
audio_sync = "true"
audio_latency = "64"
# No remote control surface: this Pi is a guest Wi-Fi AP.
network_cmd_enable = "false"
stdin_cmd_enable = "false"
netplay_nat_traversal = "false"
menu_driver = "rgui"
menu_show_start_screen = "false"
menu_pause_libretro = "false"
pause_nonactive = "false"
fps_show = "false"
log_verbosity = "true"
libretro_log_level = "1"
input_autodetect_enable = "false"
input_libretro_device_p1 = "1"
input_libretro_device_p2 = "1"
input_libretro_device_p3 = "1"
input_libretro_device_p4 = "1"
input_libretro_device_p5 = "1"
