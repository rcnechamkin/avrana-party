# Workflow v3: contract declarations run on PR; real-service/browser proofs run only on dispatch.
# Party <-> Games compatibility (AVR-219, AVR-233). Games is checked out at the branch whose name
# carries the same AVR number as this branch (docs/CROSS-REPO.md), otherwise main. Then:
#   1. both contract declarations are proven against their code and compared (tools/contract_check.py);
#   2. the real Party service drives the real games server over loopback (Games' cross-repo pytest);
#   3. the browser provider suite runs the shell against both (tests/provider, Chromium).
# Nothing here deploys. Both repositories are private: every Games read uses the read-only deploy key in the AVRANA_GAMES_READ_KEY secret (docs/CROSS-REPO.md).
name: Cross-repo contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: party
          persist-credentials: false
      - name: Access check - read the Games repository (red here = credential problem, not a test failure)
        id: peer
        env:
          PEER_REPO: rcnechamkin/avrana-party-games
          PEER_KEY: ${{ secrets.AVRANA_GAMES_READ_KEY }}
          SECRET_NAME: AVRANA_GAMES_READ_KEY
          DOC: docs/CROSS-REPO.md (Private repositories and the read keys)
          BRANCH: ${{ github.head_ref || github.ref_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash party/.github/ci/peer-access.sh
      - uses: actions/checkout@v7
        with:
          repository: rcnechamkin/avrana-party-games
          ref: ${{ steps.peer.outputs.ref }}
          path: games
          ssh-key: ${{ secrets.AVRANA_GAMES_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.12'
      - name: Contract declarations agree with both code bases and each other
        run: python3 party/tools/contract_check.py --party party --games games
      - name: Install the games server's dependencies
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m pip install -r games/requirements-dev.txt
      - name: Real native child and Party session over Unix sockets (may not skip)
        if: github.event_name == 'workflow_dispatch'
        working-directory: party
        env:
          AVRANA_GAMES_REPO: ${{ github.workspace }}/games
          AVRANA_REQUIRE_NATIVE: '1'
        run: python3 -m unittest discover -s tests/unit -p test_native_checkers.py -v
      - name: Real Party service drives the real games server (may not skip)
        if: github.event_name == 'workflow_dispatch'
        working-directory: games
        env:
          AVRANA_PARTY_REPO: ${{ github.workspace }}/party
          AVRANA_REQUIRE_PARTY: '1'
        run: python3 -m pytest -q -rs tests/test_party_session_cross_repo.py tests/test_avrana_contract.py
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: party/package-lock.json
      - name: Install the shell's test dependencies and Chromium
        if: github.event_name == 'workflow_dispatch'
        working-directory: party
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser provider suite against both repositories
        if: github.event_name == 'workflow_dispatch'
        working-directory: party
        env:
          AVRANA_GAMES_REPO: ${{ github.workspace }}/games
        run: npx playwright test -c playwright.provider.config.ts
