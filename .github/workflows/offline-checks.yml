# Workflow v3: fast PR checks, full suite only when explicitly dispatched.
# Run full verification before merging high-risk code and for release candidates.
# Offline CI lane: checks that need no Pi, phones, Party Wi-Fi, HDMI, Bluetooth,
# streaming/emulator hardware or power telemetry (Tier 1 and the simulated-Party
# Tier 2). The live-appliance Playwright suite (`npm run test:live`, soak, fault) stays
# manual; see docs/TESTING.md.
name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same Node as the validated Cloud workspace (Node 22.22.2, npm 10.9.7).
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: Repository integrity and generated freshness
        run: npm run check:repo

      # History is evidence, not architecture: a PR that edits docs/archive or an existing dated
      # finding fails unless it carries the `historical-edit` label (docs/REPOSITORY-GOVERNANCE.md).
      - name: Historical documents are not edited without intent
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'historical-edit') && '--allow-historical' || '' }}
          # This repository is private and checkout runs with persist-credentials: false, so the
          # fetch authenticates with the job's own read-only token, passed to this step only and
          # never written to .git/config (AVR-428).
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          gitx() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          gitx fetch --no-tags --depth=200 origin "$BASE" || gitx fetch --no-tags origin "$BASE"
          python3 tools/repo-check.py --changed-since "$BASE" $ALLOW

      - name: Party side of the Party <-> Games contract declaration
        run: python3 tools/contract_check.py

      - name: Derived context fixture and configuration checks (no credentials)
        run: |
          python3 -m unittest discover -s tests/context -v
          python3 tools/graphify_context.py check-config
          python3 tools/graphify_context.py check-semantic

      - name: Deterministic Graphify AST smoke check (no model backend)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install graphifyy==0.9.74
          python3 tools/graphify_context.py refresh --architecture
          python3 tools/graphify_context.py status --architecture

      # Pure unit tests: no browser is launched, so no `playwright install`.
      - name: Soak metric maths
        run: npx playwright test -c playwright.live.config.ts tests/live/soak-metrics.spec.ts --project=chromium

      # AGENTS.md: the two committed nginx sites must stay byte-identical.
      - name: nginx site files are identical
        run: cmp avrana-party.nginx arcade/nginx-site

      - name: Fast Python protocol and session regression smoke
        run: |
          python3 -m unittest discover -s tests/unit -p test_party_protocol.py -q
          python3 -m unittest discover -s tests/unit -p test_party_session_flow.py -q

      # Tier 1: platform contracts, provider adapters, arcade wiring (GStreamer stubbed), web build
      # and install script. Tier 2 inside the same run: a real nginx with the committed site on high
      # ports (captive probe unchanged on HTTP, /party/ shell on HTTPS). Stdlib Python only.
      - name: Python unit tests
        if: github.event_name == 'workflow_dispatch'
        env:
          AVRANA_REQUIRE_NGINX: '1'
          AVRANA_REQUIRE_LOGROTATE: '1'
          AVRANA_REQUIRE_SYSTEMD_ANALYZE: '1'     # AVR-29: journald precedence by systemd's own ordering
        run: |
          command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }
          command -v logrotate >/dev/null || [ -x /usr/sbin/logrotate ] || { sudo apt-get update -q && sudo apt-get install -y -q logrotate; }
          python3 -m unittest discover -s tests/unit -v

      # AVR-59: the EXPERIMENTAL .avrgame developer tools export (validator + packer, stdlib only). Built from
      # this commit, unpacked and run from a clean directory (PYTHONPATH cleared, outside any repository) on a
      # fixture game, and compared byte for byte with this repository's own tool; the job fails if any of that
      # does not hold. The zip is NOT kept as an artifact: the export is not to be handed to anyone until the owner
      # decides, and an artifact is downloadable by anyone with read access. The sha256 and the file list are
      # printed so a build on another machine can be compared (the bytes do not depend on the platform).
      - name: Build and verify the .avrgame tools export (nothing is kept or published)
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/build_avrgame_tools.py --out "$RUNNER_TEMP/avrgame-tools"

      # The browser modules (capability probe, seat evaluation, keep-awake, service worker) in Node.
      - name: Browser module unit tests
        run: node --test 'tests/offline/*.test.mjs'

      # Tier 2: real Chromium against a simulated Party on 127.0.0.1 (a secure context).
      - name: Install Chromium for the offline browser suite
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Offline browser tests
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test -c playwright.offline.config.ts

      # Tier 2: several browser contexts (phones) against a real Party Core behind the dev server.
      - name: Multi-client Party browser tests
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test -c playwright.party.config.ts
