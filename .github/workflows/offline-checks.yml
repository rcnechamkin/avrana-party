# Offline CI lane: checks that need no Pi, phones, Party Wi-Fi, HDMI, Bluetooth,
# streaming/emulator hardware or power telemetry. The live-appliance Playwright
# suite (`npm test`, soak, fault) stays manual; see docs/TESTING.md.
name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same Node as the validated Cloud workspace (Node 22.22.2, npm 10.9.7).
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      # Pure unit tests: no browser is launched, so no `playwright install`.
      - name: Soak metric maths
        run: npx playwright test tests/soak-metrics.spec.ts

      # CLAUDE.md: the two committed nginx sites must stay byte-identical.
      - name: nginx site files are identical
        run: cmp avrana-party.nginx arcade/nginx-site
