# Offline CI lane: checks that need no Pi, phones, Party Wi-Fi, HDMI, Bluetooth,
# streaming/emulator hardware or power telemetry (Tier 1 and the simulated-Party
# Tier 2). The live-appliance Playwright suite (`npm test`, soak, fault) stays
# manual; see docs/TESTING.md.
name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same Node as the validated Cloud workspace (Node 22.22.2, npm 10.9.7).
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: Repository integrity and generated freshness
        run: npm run check:repo

      - name: Derived context fixture and configuration checks (no credentials)
        run: |
          python3 -m unittest discover -s tests/context -v
          python3 tools/graphify_context.py check-config
          python3 tools/graphify_context.py check-semantic

      - name: Deterministic Graphify AST smoke check (no model backend)
        run: |
          python3 -m pip install graphifyy==0.9.74
          python3 tools/graphify_context.py refresh --architecture
          python3 tools/graphify_context.py status --architecture

      # Pure unit tests: no browser is launched, so no `playwright install`.
      - name: Soak metric maths
        run: npx playwright test tests/soak-metrics.spec.ts

      # AGENTS.md: the two committed nginx sites must stay byte-identical.
      - name: nginx site files are identical
        run: cmp avrana-party.nginx arcade/nginx-site

      # Tier 1: platform contracts, provider adapters, arcade wiring (GStreamer stubbed), web build
      # and install script. Tier 2 inside the same run: a real nginx with the committed site on high
      # ports (captive probe unchanged on HTTP, /party/ shell on HTTPS). Stdlib Python only.
      - name: Python unit tests
        env:
          AVRANA_REQUIRE_NGINX: '1'
          AVRANA_REQUIRE_LOGROTATE: '1'
        run: |
          command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }
          command -v logrotate >/dev/null || [ -x /usr/sbin/logrotate ] || { sudo apt-get update -q && sudo apt-get install -y -q logrotate; }
          python3 -m unittest discover -s tests/unit -v

      # The browser modules (capability probe, seat evaluation, keep-awake, service worker) in Node.
      - name: Browser module unit tests
        run: node --test 'tests/offline/*.test.mjs'

      # Tier 2: real Chromium against a simulated Party on 127.0.0.1 (a secure context).
      - name: Install Chromium for the offline browser suite
        run: npx playwright install --with-deps chromium

      - name: Offline browser tests
        run: npx playwright test -c playwright.offline.config.ts
