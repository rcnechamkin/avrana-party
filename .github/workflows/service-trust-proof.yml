# Non-production proofs for ADR 0016, on disposable runners; each runs only when what it proves
# changes, or on demand. They are evidence about systemd on Ubuntu, not about the Pi (docs/TESTING.md
# tiers).
#   proof        (AVR-227) the systemd primitives the service trust boundary relies on (DynamicUser,
#                LoadCredential, state directories, Unix-socket permissions) behave as the ADR says,
#                and the boundary checker's collector reads a real dynamic-user unit.
#   native-game  (AVR-236) `provision-game standin` as root, then Party Core (its real units) launches
#                and ends a session with the provisioned stand-in game over real socket activation
#                and a real LoadCredential= key; boundary checker; rotate refused during a session;
#                remove leaves nothing. Creates and removes users, units and /opt, /etc: runner only.
#   prepare-native-games  (AVR-304) `ops/prepare-native-games` on a phase 1 host with Party Core's
#                earlier unit, then `provision-game` of the stand-in, a session, and the reverse.
#   checkers     (AVR-238) the real Checkers of the paired Games branch: `ops/prepare-native-games`,
#                `provision-game checkers` against the real appliance profile, Party Core launching
#                the socket-activated game, a game played to its natural end by two phones, a
#                Host-ended session, the phase 2 boundary checker, and remove. Runner only.
#   package      (AVR-39, EXPERIMENTAL) the Hello Party .avrgame package of the paired Games branch: built
#                unprivileged, refused when tampered, installed by `ops/install-game`, two sessions,
#                the phase 2 boundary checker, removed, re-installed. Runner only.
#   package-browser (AVR-338, EXPERIMENTAL) the same installed package, played in REAL BROWSERS
#                (Playwright Chromium and WebKit) through Party Home, the Host's launch, the game origin
#                and the bridge, behind the committed nginx site with a throwaway certificate; then
#                removed. Discovery is harness-assisted until AVR-337. Runner only; not a phone.
name: Service trust proof

on:
  pull_request:
    paths:
      - 'avrana/**'
      - 'contracts/**'
      - 'deploy/**'
      - 'ops/provision-game'
      - 'ops/prepare-native-games'
      - 'ops/install-game'
      - 'experiments/**'
      - 'tests/package/**'
      - 'playwright.package.config.ts'
      - 'avrana-party.nginx'
      - 'web/party/**'
      - 'tests/fixtures/appliances/**'
      - '.github/workflows/service-trust-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: systemd identity, credential and socket-permission checks
        run: sudo AVRANA_TRUST_PROOF=1 bash experiments/service-trust/proof.sh

  native-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: provision-game, a real session, the boundary checker, rotate and remove
        run: sudo AVRANA_NATIVE_GAME_PROOF=1 bash experiments/native-game/proof.sh

  # (AVR-304) `ops/prepare-native-games` on a host that has ADR 0016 phase 1 and Party Core's EARLIER
  # unit (no ExecReload=, no socket unit, no registry key): refused without phase 1; --dry-run changes
  # nothing; the run restarts Party Core and leaves the units, the socket (avrana-party:avrana-games
  # 0660) and one added registry member; a second run changes and restarts nothing; provision-game
  # and a real session work; --reverse refused while a game is provisioned; no restart while a session
  # runs; --reverse shows the earlier state again. Creates and removes users, units and /opt, /etc,
  # /var/backups: runner only.
  prepare-native-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: prepare-native-games, provision-game, a real session, and the reverse
        run: sudo AVRANA_PREPARE_PROOF=1 bash experiments/native-game/prepare-proof.sh

  # (AVR-238) The real Checkers, not the stand-in: the Games checkout is the branch paired with this
  # one (same logic as cross-repo.yml, and like it a failure to list the branches fails the job).
  checkers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: party
          persist-credentials: false
      - name: Resolve the matching Games branch
        id: peer
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # A failure to list the other repository's branches must fail this job: falling back to
          # main would report compatibility that was never checked against the paired branch.
          heads=$(git ls-remote --heads https://github.com/rcnechamkin/avrana-party-games.git             | awk '{print $2}' | sed 's#refs/heads/##')
          [ -n "$heads" ] || { echo "::error::could not list avrana-party-games branches"; exit 1; }
          avr=$(echo "$BRANCH" | grep -oiE 'avr-[0-9]+' | head -1 | tr 'A-Z' 'a-z' || true)
          ref=main; why='no AVR id in this branch name'
          if [ -n "$avr" ]; then
            why="no Games branch carries $avr"
            if echo "$heads" | grep -qxF "$BRANCH"; then
              ref=$BRANCH; why='same branch name'
            else
              match=$(echo "$heads" | grep -iE "(^|[/-])${avr}([-/]|$)" | sort | head -1 || true)
              if [ -n "$match" ]; then ref=$match; why="first branch carrying $avr"; fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Games ref for this run: $ref ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: rcnechamkin/avrana-party-games
          ref: ${{ steps.peer.outputs.ref }}
          path: games
          persist-credentials: false
      - name: Checkers - prepare, provision-game, a complete game, a Host-ended session, the boundary, remove
        run: sudo AVRANA_CHECKERS_PROOF=1 AVRANA_GAMES_REPO="$GITHUB_WORKSPACE/games" bash party/experiments/native-game/checkers-proof.sh

  # (AVR-39, EXPERIMENTAL) An .avrgame package, not a game of the release tree: the Hello Party package is
  # built unprivileged from the paired Games branch's committed recipe, refused when tampered or wrong,
  # installed by `ops/install-game` through provision-game, played by two phones, removed during no
  # session (refused during one), and left no trace. The release tree copied to /opt has no contract
  # for the game. The Games checkout is the branch paired with this one (same logic as the checkers
  # job above). Runner only.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: party
          persist-credentials: false
      - name: Resolve the matching Games branch
        id: peer
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # A failure to list the other repository's branches must fail this job: falling back to
          # main would report compatibility that was never checked against the paired branch.
          heads=$(git ls-remote --heads https://github.com/rcnechamkin/avrana-party-games.git             | awk '{print $2}' | sed 's#refs/heads/##')
          [ -n "$heads" ] || { echo "::error::could not list avrana-party-games branches"; exit 1; }
          avr=$(echo "$BRANCH" | grep -oiE 'avr-[0-9]+' | head -1 | tr 'A-Z' 'a-z' || true)
          ref=main; why='no AVR id in this branch name'
          if [ -n "$avr" ]; then
            why="no Games branch carries $avr"
            if echo "$heads" | grep -qxF "$BRANCH"; then
              ref=$BRANCH; why='same branch name'
            else
              match=$(echo "$heads" | grep -iE "(^|[/-])${avr}([-/]|$)" | sort | head -1 || true)
              if [ -n "$match" ]; then ref=$match; why="first branch carrying $avr"; fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Games ref for this run: $ref ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: rcnechamkin/avrana-party-games
          ref: ${{ steps.peer.outputs.ref }}
          path: games
          persist-credentials: false
      - name: Package - build, refusals, install-game, two sessions, the boundary, remove, re-install
        run: sudo AVRANA_PACKAGE_PROOF=1 AVRANA_GAMES_REPO="$GITHUB_WORKSPACE/games" bash party/experiments/native-game/package-proof.sh

  # (AVR-338, EXPERIMENTAL) Real browsers against the INSTALLED Hello Party package: the disposable
  # appliance of the package job plus the committed nginx site on party.avrana.net / games.avrana.net
  # (throwaway certificate, /etc/hosts), Playwright Chromium and WebKit as phones. The Games checkout is
  # the branch paired with this one (same logic as the jobs above). Runner only. Tier 2: not a phone,
  # not Wi-Fi, not the Pi (docs/TESTING.md).
  package-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: party
          persist-credentials: false
      - name: Resolve the matching Games branch
        id: peer
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          heads=$(git ls-remote --heads https://github.com/rcnechamkin/avrana-party-games.git             | awk '{print $2}' | sed 's#refs/heads/##')
          [ -n "$heads" ] || { echo "::error::could not list avrana-party-games branches"; exit 1; }
          avr=$(echo "$BRANCH" | grep -oiE 'avr-[0-9]+' | head -1 | tr 'A-Z' 'a-z' || true)
          ref=main; why='no AVR id in this branch name'
          if [ -n "$avr" ]; then
            why="no Games branch carries $avr"
            if echo "$heads" | grep -qxF "$BRANCH"; then
              ref=$BRANCH; why='same branch name'
            else
              match=$(echo "$heads" | grep -iE "(^|[/-])${avr}([-/]|$)" | sort | head -1 || true)
              if [ -n "$match" ]; then ref=$match; why="first branch carrying $avr"; fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Games ref for this run: $ref ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: rcnechamkin/avrana-party-games
          ref: ${{ steps.peer.outputs.ref }}
          path: games
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: party/package-lock.json
      - name: Install from the committed lockfile
        working-directory: party
        run: npm ci
      - name: Install the browsers
        working-directory: party
        run: npx playwright install --with-deps chromium webkit
      - name: Package in real browsers - install, play, reconnect, result, remove
        run: sudo env "PATH=$PATH" AVRANA_PACKAGE_BROWSER_PROOF=1 AVRANA_BROWSER_WEBKIT=1 AVRANA_GAMES_REPO="$GITHUB_WORKSPACE/games" bash party/experiments/native-game/package-browser-proof.sh
      - name: Keep the browsers' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-browser-results
          path: party/test-results/package-browser
          if-no-files-found: ignore
          retention-days: 7
