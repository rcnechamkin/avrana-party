# systemd drop-in for the arcade: Gauntlet II runs only while the Party starts it (AVR-134, ADR 0009).
#   sudo install -D -m 0644 deploy/arcade/avrana-party-session.conf \
#        /etc/systemd/system/avranaparty-arcade.service.d/avrana-party-session.conf
#   sudo systemctl daemon-reload && sudo systemctl restart avranaparty-arcade
# With this file (and /etc/avrana-party/game-keys/arcade-gauntlet2.key, from
# ops/provision-party-game-key.sh, owned by Party Core) the arcade's page, controllers and /arcade/stats stay up, but
# RetroArch and the video/audio encode run only between the Party's signed launch and end, which
# Party Core sends to 127.0.0.1:8098 (never proxied by nginx). Both values or neither: without a
# key or a loopback party URL the arcade runs always-on, as before.
#   LoadCredential     systemd reads the arcade's own key as root at start and hands this unit a
#                      private copy; the arcade has no access to the key directory (ADR 0016).
#                      Needs the key loader of AVR-253 in the deployed code.
#   AVRANA_PARTY_KEYS  %d, the unit's credentials directory: a directory of <game>.key files
#   AVRANA_PARTY_URL   Party Core on loopback, where an `abandoned` report goes after a fatal error
#   AVRANA_PARTY_ORIGIN  optional, unset today. The Party's browser origin when the arcade page is
#                      served from another one (ADR 0013, AVR-226): the page then reaches the Party
#                      only through its bridge frame. Set it (Environment=AVRANA_PARTY_ORIGIN=
#                      https://party.avrana.net) only together with the game host name's
#                      certificate, DNS record, nginx server block and Party Core's game_origins.
# Rollback: remove this file, daemon-reload, restart the arcade (always-on again), and remove the
# arcade-gauntlet2 entry from /etc/avrana-party/party-core.json (restart Party Core).
# No new privileges: the arcade keeps its unit and groups; Party Core never touches systemd.
[Service]
LoadCredential=arcade-gauntlet2.key:/etc/avrana-party/game-keys/arcade-gauntlet2.key
Environment=AVRANA_PARTY_KEYS=%d
Environment=AVRANA_PARTY_URL=http://127.0.0.1:8191
