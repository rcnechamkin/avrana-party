# systemd-journald size bounds for the appliance (AVR-30). Every Avrana service logs to the
# journal (nginx aside): avranaparty-games, avranaparty-arcade, avrana-party-core, the telemetry
# timer. Owner-installed (docs/runbooks/logs-and-retention.md):
#
#   sudo install -D -m 0644 deploy/journald/avrana-journald.conf /etc/systemd/journald.conf.d/avrana.conf
#   sudo systemctl restart systemd-journald
#
# Explicit caps instead of journald's percentage defaults, so a small card behaves like a big one.
# Whether the journal survives reboot (Storage=) is AVR-29's decision, not this file's.
[Journal]
SystemMaxUse=256M
SystemKeepFree=1G
RuntimeMaxUse=64M
MaxFileSec=1week
