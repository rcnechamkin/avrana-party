# systemd-journald for the appliance: bounded, and kept across reboots (AVR-30, AVR-29). Every
# Avrana service logs to the journal (nginx aside): avranaparty-games, avranaparty-arcade,
# avrana-party-core, the telemetry timer. Owner-installed with
# deploy/journald/install-persistent-journal.sh (docs/runbooks/logs-and-retention.md).
#
# Installed as /etc/systemd/journald.conf.d/avrana.conf. Drop-ins from /usr/lib and /etc are read in
# one list sorted by file name and a later file wins for a key it sets, so "avrana.conf" overrides
# Raspberry Pi OS's /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf (Storage=volatile):
# letters sort after digits. The installer checks the effective value with systemd-analyze.
#
# Explicit caps instead of journald's percentage defaults, so a small card behaves like a big one.
# Persistent storage costs SD-card writes, bounded in size by SystemMaxUse; the runbook has the
# estimate and the rollback.
[Journal]
Storage=persistent
SystemMaxUse=256M
SystemKeepFree=1G
RuntimeMaxUse=64M
MaxFileSec=1week
